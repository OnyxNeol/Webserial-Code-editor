<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Web Editor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://microsoft.github.io/monaco-editor/node_modules/monaco-editor/min/vs/editor/editor.main.css">
</head>
<body>
  <div id="app">
    <div id="top-row">
    <!-- Activity Bar -->
    <div id="activity-bar">
      <div class="activity-icon active" data-view="explorer" title="Explorer">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 3h7v7H3V3m11 0h7v7h-7V3m0 11h7v7h-7v-7M3 14h7v7H3v-7m9-9v3h3V5h-3M5 5v3h3V5H5m0 9v3h3v-3H5m9 0v3h3v-3h-3z"/></svg>
      </div>
      <div class="activity-icon" data-view="search" title="Search">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5l-1.5 1.5l-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16A6.5 6.5 0 0 1 3 9.5A6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14S14 12 14 9.5S12 5 9.5 5z"/></svg>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">Explorer</span>
      </div>
      <div id="file-tree"></div>
      <div id="search-panel" style="display:none">
        <input type="text" id="search-input" placeholder="Search in files...">
        <div id="search-results"></div>
      </div>
    </div>

    <!-- Main Editor Area -->
    <div id="main">
      <div id="tabs"></div>
      <div id="editor-container"></div>
      <div id="welcome" style="display:none">
        <div class="welcome-content">
          <h1>VS Code Web Editor</h1>
          <p>Editing evolved</p>
          <div class="welcome-section">
            <h2>Start</h2>
            <button class="welcome-btn" onclick="createFile()">New File...</button>
          </div>
          <div class="welcome-section">
            <h2>Recent</h2>
            <p class="muted">Open a file from the explorer to start editing.</p>
          </div>
        </div>
      </div>
    </div>

    </div><!-- /top-row -->
    <!-- Status Bar -->
    <div id="status-bar">
      <span id="status-left">Ready</span>
      <span id="status-right">Ln 1, Col 1</span>
    </div>
  </div>

  <script src="https://microsoft.github.io/monaco-editor/node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
