services:
  vscode-web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /vscode
    ports:
      - "3000:3000"
    volumes:
      - ./vscode:/vscode
      - vscode_node_modules:/vscode/node_modules
      - vscode_build_node_modules:/vscode/build/node_modules
      - vscode_build:/vscode/.build
    environment:
      - BASE44_PREVIEW_MODE=1
    command: ["sh", "-ec", "npx gulp compile-web && ./scripts/code-web.sh --host 0.0.0.0 --port 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

volumes:
  vscode_node_modules:
  vscode_build_node_modules:
  vscode_build:
