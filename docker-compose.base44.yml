services:
  vscode-web:
    image: node:24-bookworm
    working_dir: /vscode
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
      - ./vscode:/vscode
      - ./.base44:/base44:ro
      - vscode_node_modules:/vscode/node_modules
      - vscode_build_node_modules:/vscode/build/node_modules
      - vscode_build:/vscode/.build
      - workspace_data:/repo/workspace
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FLASHER_API_URL=http://flasher:8001
    # Browser-only development does not need Electron/native dependency hooks.
    # Install from the checkout's lockfiles after volumes have been mounted.
    command:
      - bash
      - -ec
      - |
        if ! test -f package.json; then git -C /repo submodule update --init --depth 1 vscode; fi
        npm ci --ignore-scripts --no-audit --no-fund
        npm --prefix build ci --ignore-scripts --no-audit --no-fund
        exec node /base44/vscode-dev.mjs
    restart: on-failure
    depends_on:
      flasher:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status===200||r.status===403){process.exit(0)}throw Error('VS Code web not responsive: '+r.status)}).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  flasher:
    build:
      context: .
      dockerfile: Dockerfile.flasher
    working_dir: /app
    ports:
      - "8001:8001"
    volumes:
      - ./tools/flasher:/app
      - workspace_data:/repo/workspace
      - pio_core:/root/.platformio
    environment:
      - WORKSPACE_DIR=/repo/workspace
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
    command: ["python", "server.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vscode_node_modules:
  vscode_build_node_modules:
  vscode_build:
  workspace_data:
  pio_core:
