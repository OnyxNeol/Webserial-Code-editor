services:
  editor:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
    volumes:
      - ./:/app
      - editor_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install && exec npx nodemon server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  editor_node_modules:
